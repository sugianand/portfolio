    <script>
      // Pick the theme before first paint: a saved choice wins, else the OS setting.
      ;(function () {
        var t = null
        try { t = localStorage.getItem('sa26:theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f3ec')
      })()
    </script>
