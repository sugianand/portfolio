<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a09" />
    <meta name="robots" content="noindex" />
    <!-- GitHub Pages serves this for any missing path, at any depth, so links are absolute. -->
    <link rel="icon" type="image/svg+xml" href="/portfolio/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" />
    <title>Page not found — Suganeshwara Anand</title>
    <style>
      :root {
        --ink: #0a0a09;
        --ink-2: #131311;
        --line: #2b2b27;
        --cream: #f4f0e9;
        --muted: #aaa498;
        --accent: #fa6945;
        --green: #8ee19c;
        --display: 'Syne', 'Arial Black', system-ui, sans-serif;
        --sans: 'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif;
        --mono: 'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
        font-family: var(--sans);
        font-size: 16px;
        line-height: 1.5;
        color: var(--cream);
        background: var(--ink);
        color-scheme: dark;
        -webkit-font-smoothing: antialiased;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 32px clamp(16px, 4vw, 56px); background: var(--ink); }
      a { color: inherit; }
      ::selection { background: var(--accent); color: var(--ink); }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      main { width: 100%; max-width: 640px; }
      .code { font-family: var(--display); font-weight: 800; font-size: clamp(88px, 26vw, 168px); line-height: .9; letter-spacing: -.04em; color: var(--accent); margin: 0; }
      h1 { font-family: var(--display); font-weight: 700; font-size: clamp(26px, 6vw, 40px); line-height: 1.1; margin: 16px 0 12px; }
      p { margin: 0; color: var(--muted); font-size: 17px; }
      .shell { margin: 28px 0 32px; padding: 16px 18px; background: var(--ink-2); border: 1px solid var(--line); border-radius: 12px; font-family: var(--mono); font-size: 14px; overflow-wrap: anywhere; }
      .shell .prompt { color: var(--green); }
      .shell .err { color: var(--muted); }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; }
      .btn { display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 999px; border: 1px solid var(--line); font-weight: 600; font-size: 16px; text-decoration: none; transition: border-color .2s, background .2s; }
      .btn:hover { border-color: var(--cream); }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--ink); }
      .btn.primary:hover { background: var(--cream); border-color: var(--cream); }
      @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>This page wandered off.</h1>
      <p>The link may be old or mistyped. Everything on the site lives on one page, so the fastest way back is home.</p>
      <div class="shell" aria-label="Terminal">
        <div><span class="prompt">sugi@portfolio:~$</span> cd <span id="path">this-page</span></div>
        <div class="err">cd: no such file or directory</div>
      </div>
      <nav class="actions" aria-label="Where to next">
        <a class="btn primary" href="/portfolio/">Back to the portfolio</a>
        <a class="btn" href="/portfolio/#projects">See projects</a>
        <a class="btn" href="/portfolio/#contact">Get in touch</a>
      </nav>
    </main>
    <script>
      // Echo the missing path into the fake shell; textContent keeps it inert.
      try {
        var p = decodeURIComponent(location.pathname.replace(/^\/portfolio\/?/, '')) || 'this-page'
        document.getElementById('path').textContent = p.length > 80 ? p.slice(0, 77) + '…' : p
      } catch (e) {}
    </script>
  </body>
</html>
